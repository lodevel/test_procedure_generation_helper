# Workflow-editor (Procedo Studio) CI.
#
# Gates that need no host app and block: ruff (curated E9/F config in pyproject), mypy (Qt-free
# workflow_editor/core only) and the AST size-budget ratchet.
#
# The full suite is NOT run here: Studio imports the host (Procedo Bench) for its theme, dialogs
# and help, and the host is not available to this repo's CI. The host repo's CI runs this suite
# with the host installed (its ci.yml, "external/test_procedure_generation_helper" step).
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: ruff check
        run: ruff check .

      - name: mypy (Qt-free core)
        run: mypy

      # Pure pathlib+ast — no Qt, no bundle, no display needed.
      - name: size-budget ratchet
        run: |
          pip install pytest
          python -m pytest tests/test_size_budgets.py -q
