# Workflow-editor CI.
#
# Two tiers:
#   * gates  — checks that are platform-independent and GREEN today: ruff
#              (curated E9/F config in pyproject), mypy (Qt-free
#              workflow_editor/core only) and the AST size-budget ratchet.
#              These block.
#   * suite  — the full pytest run. Tests needing a built project bundle /
#              installed grammar pack or a spawn-capable console skip
#              themselves via the precondition probes in tests/_env.py, so no
#              exclusion list is needed. The suite is green headless on
#              Windows and was observed green on Linux (2026-07-06, 964
#              passed) — the job is BLOCKING. Sole indulgence: a Qt teardown
#              segfault AFTER a green summary is tolerated (see the step).
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: ruff check
        run: ruff check .

      - name: mypy (Qt-free core)
        run: mypy

      # Pure pathlib+ast — no Qt, no bundle, no display needed.
      - name: size-budget ratchet
        run: |
          pip install pytest
          python -m pytest tests/test_size_budgets.py -q

  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libs for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Bundle/pack-dependent tests skip themselves via tests/_env.py probes.
      # PySide6 offscreen is known to segfault (exit 139) during Qt teardown
      # at interpreter exit AFTER all tests passed; tolerate 139 ONLY when the
      # printed summary is itself green (a mid-run crash never prints one).
      - name: pytest (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest tests -q | tee pytest.out
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 139 ] && tail -5 pytest.out | grep -qE "[0-9]+ passed" \
             && ! tail -5 pytest.out | grep -qE "[0-9]+ (failed|error)"; then
            echo "::warning::Qt teardown segfault after a green run - tolerated"
            rc=0
          fi
          exit $rc
