[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procedo-studio"
version = "0.1.0"
description = "Qt workflow editor for authoring structured test procedures"
license = {text = "MPL-2.0"}
requires-python = ">=3.10,<3.14"
# Mirrors requirements.txt. QScintilla stays commented there (optional syntax
# highlighting) and is intentionally NOT a hard dependency here.
dependencies = [
    "PySide6==6.10.2",  # pinned with the host: the version every gate is tested with
    "requests>=2.28.0",
    "python-docx>=1.1.0",
    # authoring skill loader (frontmatter parsing)
    "PyYAML>=6.0",
    # pdf read tool (text-layer extraction)
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

# `python -m procedo.studio` already works via procedo/studio/__main__.py;
# this exposes the same entry point as a console script.
[project.scripts]
procedo-studio = "procedo.studio.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["procedo.studio*", "procedo.engine_client*"]

[tool.setuptools.package-data]
# Procedo Studio's mark (the header) and window icon.
"procedo.studio" = ["icons/*.svg"]

# --- Lint gate -------------------------------------------------------------
# GREEN DAY-1: this tree has never been through a format/autofix pass, so the
# host's full E,F,W,I,UP,B ruleset is red everywhere. We block on the
# crash-class pyflakes/syntax rules (E9 + F) and defer the pervasive
# unused-import / unused-local cleanup (F401/F841). Ratchet: tighten `select`
# as files are cleaned.
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = ["E9", "F"]
# Pervasive across the never-formatted tree; deferred to a dedicated cleanup.
ignore = ["F401", "F841"]

# --- Type gate (Qt-free core only) -----------------------------------------
# GREEN DAY-1: scoped to procedo/studio/core (the Qt-free logic layer). Qt
# dialogs / god-files stay out. Lenient settings + per-module grandfathering
# keep it green today; ratchet by removing overrides / raising strictness.
[tool.mypy]
python_version = "3.10"
files = ["procedo/studio/core"]
# `procedo` is a namespace package (no __init__.py): name modules from this folder.
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "procedo.studio.core.procedure_export",
    "procedo.studio.core.odb_inspect",
    "procedo.studio.core.artifact_manager",
    "procedo.studio.core.task_config",
]
ignore_errors = true
